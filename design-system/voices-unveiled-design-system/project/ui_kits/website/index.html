<!-- @dsCard group="Website" viewport="1280x760" name="Marketing site" subtitle="Interactive homepage, impact, stories & donation flow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voices Unveiled — Marketing Site</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ivory); color: var(--text-body); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  details summary::-webkit-details-marker { display: none; }
  a { color: inherit; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="Decor.jsx"></script>
  <script type="text/babel" src="SiteChrome.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>
  <script type="text/babel" src="DonatePage.jsx"></script>
  <script type="text/babel" src="ImpactStories.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    function App() {
      const [page, setPage] = useState("Home");
      const goDonate = () => { setPage("Donate"); window.scrollTo(0, 0); };
      const onNav = (p) => {
        const map = { About: "Home", Programs: "Home" };
        setPage(map[p] || p);
        window.scrollTo(0, 0);
      };
      const active = ["Impact", "Stories", "Volunteer"].includes(page) ? page : (page === "Donate" ? "" : "Home");
      return (
        <>
          <SiteHeader active={active} onNav={onNav} onDonate={goDonate} />
          {page === "Home" && <HomePage onDonate={goDonate} onNav={onNav} />}
          {page === "Donate" && <DonatePage />}
          {page === "Impact" && <ImpactPage onDonate={goDonate} />}
          {(page === "Stories" || page === "Volunteer") && <StoriesPage onDonate={goDonate} />}
          <SiteFooter />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
