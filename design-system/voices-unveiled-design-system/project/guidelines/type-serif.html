<!-- @dsCard group="Type" viewport="700x200" name="Serif display — Libre Baskerville" subtitle="Editorial serif for emotion, headlines & storytelling" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ivory); font-family: var(--font-serif); color: var(--text-strong); }
  .wrap { padding: 24px 28px; }
  .h1 { font-size: 52px; font-weight: 700; line-height: 1.05; letter-spacing: var(--tracking-tight); margin: 0; }
  .h3 { font-size: 28px; font-weight: 700; margin: 14px 0 0; }
  .q { font-style: italic; font-size: 20px; color: var(--plum); margin: 12px 0 0; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="h1">Keep her learning.</p>
    <p class="h3">Voices emerging from silence</p>
    <p class="q">"The course gave me hope and strength."</p>
  </div>
</body>
</html>
