<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base unit — calm, generous rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ivory); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { padding: 22px 28px; display: flex; gap: 18px; align-items: flex-end; }
  .col { text-align: center; }
  .bar { background: var(--terracotta); border-radius: 3px 3px 0 0; width: 30px; }
  .v { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .t { font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:8px"></div><div class="t">2</div><div class="v">8</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="t">4</div><div class="v">16</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="t">5</div><div class="v">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="t">6</div><div class="v">32</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="t">7</div><div class="v">48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="t">8</div><div class="v">64</div></div>
    <div class="col"><div class="bar" style="height:80px"></div><div class="t">9</div><div class="v">80</div></div>
  </div>
</body>
</html>
