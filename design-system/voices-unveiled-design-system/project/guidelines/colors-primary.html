<!-- @dsCard group="Colors" viewport="700x180" name="Primary palette" subtitle="Plum leads; terracotta & gold add warmth and light" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ivory); font-family: var(--font-sans); color: var(--text-body); }
  .row { display: flex; gap: 14px; padding: 22px; }
  .sw { flex: 1; }
  .chip { height: 78px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  .name { font-weight: 600; font-size: 13px; margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-muted); letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--plum)"></div><div class="name">Deep Plum</div><div class="hex">#4B2142</div></div>
    <div class="sw"><div class="chip" style="background:var(--terracotta)"></div><div class="name">Terracotta</div><div class="hex">#C46A4A</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold)"></div><div class="name">Hope Gold</div><div class="hex">#E5B84B</div></div>
    <div class="sw"><div class="chip" style="background:var(--midnight)"></div><div class="name">Midnight Blue</div><div class="hex">#1F2A44</div></div>
    <div class="sw"><div class="chip" style="background:var(--sage)"></div><div class="name">Soft Sage</div><div class="hex">#A9B8A4</div></div>
  </div>
</body>
</html>
