<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { padding: 24px 28px; max-width: 600px; }
  .lead { font-size: 20px; line-height: 1.5; margin: 0 0 12px; color: var(--text-strong); }
  .body { font-size: 17px; line-height: 1.6; margin: 0 0 12px; }
  .cap { font-size: 13px; color: var(--text-muted); margin: 0; }
  b { font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="lead">Your gift keeps education, connection, and hope alive.</p>
    <p class="body">We provide free online education, mental health support, and
    leadership development for Afghan women and girls. <b>Every story is shared with
    care and consent.</b></p>
    <p class="cap">Caption · 13px · supporting detail and metadata</p>
  </div>
</body>
</html>
