<!-- @dsCard group="Brand" viewport="700x180" name="Graphic motifs" subtitle="Thread · Veil / Layer · Voice Wave — used quietly" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ivory); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { padding: 20px 28px; display: flex; gap: 20px; }
  .m { flex: 1; background: var(--white); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px; height: 96px; position: relative; overflow: hidden; }
  .cap { font-size: 12px; font-weight: 600; position: absolute; bottom: 12px; left: 14px; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="m">
      <svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M0 30 C60 30 60 70 120 70 S200 30 260 30" fill="none" stroke="var(--terracotta)" stroke-width="1.5"/></svg>
      <span class="cap">Thread</span>
    </div>
    <div class="m">
      <svg viewBox="0 0 200 100"><path d="M30 -10 C90 40 60 90 130 110" fill="none" stroke="var(--plum-300)" stroke-width="22" opacity=".25" stroke-linecap="round"/><path d="M70 -10 C130 40 100 90 170 110" fill="none" stroke="var(--terracotta)" stroke-width="22" opacity=".18" stroke-linecap="round"/></svg>
      <span class="cap">Veil / Layer</span>
    </div>
    <div class="m">
      <svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M0 50 Q25 20 50 50 T100 50 T150 50 T200 50" fill="none" stroke="var(--plum)" stroke-width="1.5"/><path d="M0 60 Q25 38 50 60 T100 60 T150 60 T200 60" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity=".7"/></svg>
      <span class="cap">Voice Wave</span>
    </div>
  </div>
</body>
</html>
