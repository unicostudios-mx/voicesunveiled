<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals & text" subtitle="Soft ivory ground; charcoal and warm gray text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-sans); color: var(--text-body); }
  .row { display: flex; gap: 14px; padding: 22px; }
  .sw { flex: 1; }
  .chip { height: 78px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .name { font-weight: 600; font-size: 13px; margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-muted); letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ivory)"></div><div class="name">Soft Ivory</div><div class="hex">#FAF6EF</div></div>
    <div class="sw"><div class="chip" style="background:var(--ivory-200)"></div><div class="name">Ivory Sunken</div><div class="hex">#F2EBDE</div></div>
    <div class="sw"><div class="chip" style="background:var(--charcoal)"></div><div class="name">Charcoal Text</div><div class="hex">#242124</div></div>
    <div class="sw"><div class="chip" style="background:var(--warm-gray)"></div><div class="name">Warm Gray</div><div class="hex">#6F6663</div></div>
    <div class="sw"><div class="chip" style="background:var(--warm-gray-300)"></div><div class="name">Border / Disabled</div><div class="hex">#B7AFA9</div></div>
  </div>
</body>
</html>
