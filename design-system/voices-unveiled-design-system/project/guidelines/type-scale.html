<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Desktop hierarchy, H1 → caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ivory); color: var(--text-strong); }
  .wrap { padding: 22px 28px; }
  .line { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border-subtle); padding: 7px 0; }
  .tag { font-family: var(--font-sans); font-size: 11px; color: var(--text-muted); width: 92px; flex: none; letter-spacing: .03em; }
  .s { font-family: var(--font-serif); font-weight: 700; }
  .u { font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="tag">H1 · 56 Bold</span><span class="s" style="font-size:40px">Reclaiming voice</span></div>
    <div class="line"><span class="tag">H2 · 44 Bold</span><span class="s" style="font-size:32px">Our impact in 2024</span></div>
    <div class="line"><span class="tag">H3 · 32 SemiBold</span><span class="s" style="font-size:24px;font-weight:600">Programs overview</span></div>
    <div class="line"><span class="tag">Lead · 20 Reg</span><span class="u" style="font-size:18px">Education, connection, and hope.</span></div>
    <div class="line"><span class="tag">Body · 17 Reg</span><span class="u" style="font-size:15px">Functional reading copy for programs and forms.</span></div>
    <div class="line"><span class="tag">Caption · 13</span><span class="u" style="font-size:12px;color:var(--text-muted)">Metadata, notes, and fine print.</span></div>
  </div>
</body>
</html>
