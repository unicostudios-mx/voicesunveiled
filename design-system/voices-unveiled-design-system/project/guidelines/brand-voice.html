<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { padding: 22px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
  .item { border-left: 3px solid var(--sage); padding-left: 12px; }
  .item.bad { border-left-color: var(--warm-gray-300); opacity: .85; }
  .lbl { font-size: 11px; letter-spacing: var(--tracking-wide); text-transform: uppercase; margin: 0 0 4px; }
  .good .lbl { color: var(--success); }
  .bad .lbl { color: var(--text-muted); }
  .t { font-family: var(--font-serif); font-size: 16px; line-height: 1.4; margin: 0; color: var(--text-strong); }
  .bad .t { text-decoration: line-through; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item good"><p class="lbl">Say this</p><p class="t">Help Afghan women and girls continue learning, healing, and reclaiming their voices.</p></div>
    <div class="item bad"><p class="lbl">Not this</p><p class="t">These poor women have nothing left.</p></div>
    <div class="item good"><p class="lbl">Say this</p><p class="t">Your gift keeps education, connection, and hope alive.</p></div>
    <div class="item good"><p class="lbl">Always</p><p class="t">Every story is shared with care and consent.</p></div>
  </div>
</body>
</html>
