<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-sans); }
  #root { padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; max-width: 640px; }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Field, Input } = window.VoicesUnveiledDesignSystem_cb8f0b;
    function Demo() {
      return (
        <>
          <Field label="Full name" required>
            <Input placeholder="Your name" />
          </Field>
          <Field label="Email" hint="We'll never share it.">
            <Input type="email" placeholder="you@example.org" />
          </Field>
          <div className="full">
            <Field label="Why do you want to volunteer?" error="Please tell us a little more">
              <Input as="textarea" placeholder="Share your skills…" />
            </Field>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
