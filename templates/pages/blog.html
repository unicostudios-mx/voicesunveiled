{% extends 'base.html' %}
{% from 'partials/macros.html' import eyebrow, newsletter %}
{% block content %}
<section class="band">
  <div class="wrap">
    <div class="page-hero" style="margin-bottom:32px">{{ eyebrow('Voices Unveiled') }}<h1>Blog</h1></div>
    <div class="grid3 reveal">
      {% for p in posts %}
      <article class="post-card">
        <a class="ph" href="/blog/{{ p.slug }}/"><img src="{{ p.image }}" alt="" loading="lazy"></a>
        <div class="body">
          <span class="date">{{ p.date_display }}</span>
          <h3><a href="/blog/{{ p.slug }}/">{{ p.title }}</a></h3>
          <p>{{ p.excerpt }}</p>
          <a href="/blog/{{ p.slug }}/">Read More</a>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
<section class="band band--flush-top"><div class="wrap">{{ newsletter(site) }}</div></section>
{% endblock %}
