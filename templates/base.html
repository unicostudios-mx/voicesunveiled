<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}</title>
<meta name="description" content="{{ page.description or site.description }}">
<link rel="canonical" href="{{ site.base_url }}{{ page.url }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ page.title or site.name }}">
<meta property="og:description" content="{{ page.description or site.description }}">
<meta property="og:image" content="{{ site.base_url }}{{ page.image or '/assets/img/collage.jpg' }}">
<meta property="og:url" content="{{ site.base_url }}{{ page.url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v={{ build_id }}">
{% block head %}{% endblock %}
</head>
<body>
{% include 'partials/header.html' %}
<main id="main">
{% block content %}{% endblock %}
</main>
{% include 'partials/footer.html' %}
<script src="/assets/js/site.js?v={{ build_id }}" defer></script>
</body>
</html>
