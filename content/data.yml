# Página "Donate Now"
built_together:
  - Free online classes for these students, who are banned from school by the Taliban
  - Mental health support during exile, isolation, and trauma to 20+ families
  - 13 elective courses in tech, science, humanities, and arts
  - 6 rounds of our Self-Empowerment Programs that have helped them rebuild their confidence
  - Life-saving relief — food, medicine, financial support
support_ensures:
  - Access to free online education, systematically denied to them under Taliban restrictions.
  - Receive mental health support and community connection, helping them cope with isolation, trauma, and fear.
  - Receive urgent, life-saving aid — including food, medicine, and financial assistance in emergencies.
  - Reclaim their voices through courses in self-empowerment, English, data analytics, philosophy, meditation, and more.

# Página "Become a Monthly Lifeline"
monthly_support_ensures:
  - Access free online education, systematically denied to them under Taliban restrictions.
  - Receive mental health support and a vital community, helping them cope with extreme isolation, violence, uncertainty, and trauma.
  - Receive urgent, life-saving support like food and medical aid, for themselves and their families.
  - Reclaim their voices and build skills through courses in self-empowerment, English, data analytics, philosophy, meditation and more.
why_monthly:
  - Fund more scholarships for women and girls ready to learn
  - Provide emergency aid the moment it’s needed
  - Expand programs so no one is turned away
monthly_benefits:
  - Annual impact report showing exactly where your gift goes
  - A personal letter from a student
  - Invitations to virtual events with Afghan women in our programs
  - Confidence that your support continues, no matter what

