faq:
  - q: Is my donation tax-deductible?
    a: Yes. Voices Unveiled is a program of Café de la Culture, a registered 501(c)(3) tax-exempt organization (EIN 99-0810138). Your gift is tax-deductible to the full extent allowed by law.
  - q: Where does my money go?
    a: Directly to scholarships, internet access, course materials, mental health support, and emergency assistance for Afghan women and girls. Our annual impact reports show exactly where every gift goes.
  - q: Can I give monthly?
    a: Yes. Monthly Lifeline partners give a recurring gift of any amount, providing the steady support our students rely on and letting us act the moment help is needed.
  - q: Having trouble donating?
    a: If you experience any issues while submitting your donation, please contact us at hello@voicesunveiled.org. You can also try clearing your browser cache, using a different browser, or an incognito window.

