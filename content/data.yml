student_quotes:
  - { quote: "I believe that the Taliban banned education for us because they're scared of educated women. They know what an educated woman can do.", name: "R.", age: 13, detail: "Afghanistan" }
  - { quote: "My age doesn't limit my power. If the world forgets me, I won't forget myself.", name: "R.", age: 13, detail: "Afghanistan" }
  - { quote: "The Wise Woman inside of me keeps telling me to try and never give up.", name: "R.", age: 13, detail: "Afghanistan" }
  - { quote: "I was not confident enough to speak. Now I believe I am valuable, precious, and need to be heard.", name: "Ehsaneh", age: 28, detail: "Afghanistan" }
  - { quote: "I hated being a girl. I thought my life was over. Voices Unveiled helped me love myself again. It gave me hope for my life and future.", name: "Chalipa", age: 14, detail: "Afghanistan" }
  - { quote: "Before joining Voices Unveiled, I wished I could be someone else. Now I thank God that I am a girl.", name: "Dasa", age: 24, detail: "Refugee in Pakistan" }
  - { quote: "No one has ever supported me or given me the kind of encouragement and learning opportunities that Voices Unveiled has. This course gives me strength and a reason to keep going.", name: "Zahra", detail: "Afghanistan" }
  - { quote: "I want to know more about the rights that we girls should have. We do not know our own rights. I want to understand them and experience a new version of myself by knowing such things. I want to pass it on to others.", name: "Ariana", age: 17, detail: "Kabul, Afghanistan" }
  - { quote: "After taking this course, I know that I am free, I am strong, I am a woman.", name: "B.S.", age: 18, detail: "Afghanistan" }
  - { quote: "Even though you have not seen our faces, you are working very hard to amplify our voices.", name: "R.A.", age: 22, detail: "Afghanistan" }
  - { quote: "I was able to ask the questions in my heart for the first time, without any fear. I learned how to speak out against misogyny and to not give up on breaking taboos in my society.", name: "N.H.", age: 19, detail: "Afghanistan" }
  - { quote: "Most of all, I learned to have self-confidence and defend my rights and those of my peers.", name: "D.Y.", age: 18, detail: "Afghanistan" }
  - { quote: "When I heard my own words spoken out loud by actors I felt happy, excited and curious. I felt that I was free. This was the most beautiful feeling.", name: "K.N.", age: 20, detail: "Afghanistan" }
  - { quote: "I felt like I was a lost puzzle piece, and this course helped me find where I belong. It's a place to heal, a safe space where you can share your thoughts, ideas, and experiences without fear of judgment.", name: "Viana", age: 18, detail: "Afghan girl in Pakistan" }
  - { quote: "I joined the English class to improve my speaking, but then I saw the other courses, like coding and data, and felt even more excited. It made me feel smart in a new way.", name: "Najwa", age: 20, detail: "Afghanistan" }
  - { quote: "I can't fully explain what I have lost over the last three years. However, being with my Afghan sisters gives me strength, and having a supportive person like you with us is the greatest blessing we could ask for.", name: "R.Q.", age: 20, detail: "Afghanistan" }
  - { quote: "Freedom feels like an unattainable dream, but I believe in working towards it. I want to acquire all the tools this course offers to empower myself, and I will pass on everything I learn to others.", name: "F.B.", age: 25, detail: "Kabul, Afghanistan" }

supporter_quotes:
  - { quote: "I will never forget the brilliance, the passion and the sincerity of these women. They were showing me what it looks like to practice Revolutionary Love in the most oppressive circumstances. It's something we need to learn from more and more: how to get innovative, how to keep organizing, how to go underground and how to shine the light inside of us and in between us, no matter how dark it gets.", name: "Valarie Kaur", detail: "Bestselling author and founder of The Revolutionary Love Project" }
  - { quote: "If you are looking for a meaningful organization to give to, to support the women in Afghanistan, this is the organization. They are directly working with the women who will rebuild their country, fight for justice, and teach their daughters. They are planting the seeds for future generations, and this is one way to plant with them.", name: "Valarie Kaur", detail: "Bestselling author and founder of The Revolutionary Love Project" }
  - { quote: "I am so touched by the work Voices Unveiled does. Everyone should do anything they can to support them.", name: "Zainab Salbi", detail: "Founder, Women for Women International" }
  - { quote: "This is a grassroots movement: women teaching women, in secret. Girls as young as 13, learning about self-worth, leadership, writing, women's rights, and why their voice matters. Some of them risk it all just to attend. One girl walks into a cow field in the middle of the night with a lantern, just to get enough internet to join class.", name: "@crystaldawnalchemy", detail: "Supporter" }
  - { quote: "Voices Unveiled is the only safe learning space many of these girls have. This is about keeping the door open for women who are fighting for their rights and future.", name: "@crystaldawnalchemy", detail: "Supporter" }
  - { quote: "I'm just so grateful to Voices Unveiled for leading these underground classrooms and for giving us a meaningful way to be in relationship with the women and girls in Afghanistan who have been closed off from the rest of the world.", name: "Valarie Kaur", detail: "Bestselling author and founder of The Revolutionary Love Project" }
  - { quote: "Voices Unveiled is a hugely important program. The stories of the women who've attended the Voices classes tell of self-discovery, personal fulfillment, and even individual freedom within the hard frame of Afghanistan today.", name: "John Boylan", detail: "Supporter" }
  - { quote: "Afghan girls and young women are being heard and seen for who they are, who they dream of becoming. They are finding their voices, empowered to become change agents for the country they love. Our support validates their courage.", name: "Mary Faddick", detail: "Supporter" }
  - { quote: "Voices Unveiled is doing cutting edge work with Afghan women and girls, walking alongside them towards their educational goals and mental health healing. We are proud supporters and thankful for their work.", name: "Heidi Henkel", detail: "The Broomfield Resettlement Task Force" }
  - { quote: "This organization does a fantastic job of providing education and hope to Afghan women, who live under a government that provides them with neither. I am proud to be a supporter.", name: "Carol Matlack", detail: "Supporter" }
  - { quote: "Access to knowledge and education is a fundamental right. My utmost respect to Cara Cruickshank and Voices Unveiled for their incredible work in empowering Afghan girls and women.", name: "Dr. Stavit Sinai", detail: "Lecturer in Philosophy, Researcher, Editor. Berlin, Germany" }
  - { quote: "Voices Unveiled provides crucial physical, intellectual, and emotional support to women suffering under the worst gender apartheid in history. It is an act of goodness, kindness, and love that is a blessing for everyone involved.", name: "Dr. Paul Kordis", detail: "Supporter" }
  - { quote: "Hearing first hand experiences from these girls and young women who only want what our daughters take for granted is inspiring. Supporting them makes me feel like I'm making a real difference.", name: "Tania Barricklo", detail: "Supporter" }
  - { quote: "Voices Unveiled is a good example of an initiative that provides education for women in Afghanistan focused on psychological, socio-political, and gender-related topics. This is our opportunity to work with Afghan women on a massive grassroots level.", name: "Soraya Afzali", detail: "Ph.D. Candidate, Trinity College Dublin" }
  - { quote: "I firmly believe that any society, traditional or not, is destined to collapse if it silences women's voices. Women are the true custodians of our ethical, cultural and religious values and practices.", name: "Zohirbek Piltaboev", detail: "Educator and research professional, former Academic Director, Aga Khan National Council for Afghanistan" }
  - { quote: "A vital lifeline in these dark times for Afghan women. Their battle is also ours: women's rights and freedoms should never be taken for granted anywhere in the world.", name: "Helen Levy", detail: "Supporter" }
  - { quote: "An organization that puts its heart into its goals. I am a witness to the incredible and positive impact it has on the lives of Afghan women.", name: "Coral Altamirano", detail: "Supporter" }

volunteer_roles:
  - tag: Speak
    tone: plum
    title: Guest speaker
    body: Share your expertise in our Self-Empowerment Course. We welcome inspiring professionals in mental health, women's health, holistic health, women's studies, the arts, entrepreneurship, or any topic that inspires you.
  - tag: Teach
    tone: terracotta
    title: Workshop leader
    body: Work with a small group of students once a week or twice a month in your area of expertise. We especially need conversational English tutors, English proficiency test instructors, Spanish, German and French tutors, creative writing coaches, and essay mentors.
  - tag: Counsel
    tone: sage
    title: Support services
    body: Offer trauma counseling, provide personal coaching sessions, or lead a support group for students carrying isolation, uncertainty, and loss.
  - tag: Build
    tone: gold
    title: Specialized teams
    body: Join our volunteer teams for marketing, fundraising, and administration. Have other skills to lend? We are open to your unique contributions.

