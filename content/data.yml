# Datos estructurados del sitio. Todos los textos están tomados literalmente de
# las páginas publicadas en voicesunveiled.org (octubre 2026).

# Tarjetas del índice de programas (menú "Programs" del sitio original, mismo orden).
programs:
  - slug: self-empowerment-course
    tag: Empowerment Course
    tone: plum
    title: The Self-Empowerment Course
    body: Sponsor a student in Afghanistan, for a full 3 month intensive self-empowerment course. Help us build brighter futures - women are the key to making peace that lasts.
  - slug: guest-speakers
    tag: Guest Speakers
    tone: gold
    title: Distinguished Guest Speakers
    body: At Voices Unveiled, our guest speakers bring stories, wisdom, and inspiration that leave a lasting impact on our students. From global leaders to entrepreneurs, practitioners, activists and artists, each opens doors to new ideas.
  - slug: holistic-education
    tag: Holistic and Integrative Education
    tone: sage
    title: Holistic and Integrative Education
    body: At Voices Unveiled, we believe that every woman and girl in Afghanistan deserves not just education, but the emotional strength, healing, and community support to truly thrive.
  - slug: emergency-assistance
    tag: Emergency Assistance
    tone: terracotta
    title: Emergency Assistance
    body: We are committed to raising funds to meet the critical food and medical needs of our students. True self-empowerment encompasses self-care, proper nutrition, and health.

# Página "Holistic and Integrative Education" → Elective Courses
electives:
  - group: "Functional Skills:"
    items:
      - { name: "English Language (Levels 1, 2, and 3)", body: "Structured lessons and test preparation for TOEFL and Duolingo, supporting students to improve their skills, and access global education and career opportunities." }
      - { name: "Data Analytics", body: "An introduction to analyzing and interpreting data using simple tools and real-life examples, preparing students for modern job markets." }
      - { name: "Computer Programming", body: "Foundational programming skills using beginner-friendly languages, with hands-on practice and mentorship from international tech volunteers." }
  - group: "Humanities:"
    items:
      - { name: "Philosophy and Physics", body: "A unique opportunity to explore deep questions about existence, logic, and the universe, learning scientific theories and sparking curiosity and critical thinking." }
      - { name: "Creative Writing", body: "Explores self-discovery and expression through journaling, storytelling, and poetry while strengthening creativity, writing skills, and community connection." }
      - { name: "The Life of Ideas", body: "A journey into how we think, why we believe what we do, and how ideas shape the world—and us. Students explore the big patterns of thought that run through philosophy and everyday life, from separation to unity, and from confusion to wisdom. This isn’t just a class about ideas—it’s about discovering how thinking itself can become alive, creative, and your own." }
      - { name: "Art-Making - What Lives Within", body: "A journey through the inner world through artistic expression, using drawing and other art forms to transform thoughts and emotions into visual stories that offer a path to healing, self-discovery, and empowerment." }
  - group: "Sciences:"
    items:
      - { name: "Medical Science", body: "Led by a practicing physician this class explores anatomy, neuroscience, cell biology, infectious disease, and more." }
      - { name: "To the Stars and Beyond", body: "Explore the wonders of astronomy — from the Big Bang to the galaxies above us. This class celebrates discovery, curiosity, and the contributions of women in science, helping students see their place in the vast universe." }
      - { name: "Bio Science and Sustainability", body: "Explore the exciting world of biology and ecology to better understand the world around us and create a more sustainable future." }
  - group: "Wellness:"
    items:
      - { name: "Meditation", body: "A supportive space for students to build inner peace and resilience through mindfulness, breathing exercises, and reflection, helping them manage stress, calm anxiety, and navigate difficulties with emotional strength." }
      - { name: "Stress Management", body: "This class explores Post-Traumatic Stress Disorder (PTSD)—its causes, symptoms, and effects on the brain and emotions. Students will also learn evidence-based strategies for managing stress, including guided imagery exercises and techniques for creating a personal safe space." }

