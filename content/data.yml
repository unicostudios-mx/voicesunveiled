# Página "Student Testimonials" (Impact → Testimonials → Students), en el orden original.
student_quotes:
  - { quote: "Afghan women need your kind of support so that we can find ourselves, even while living through the worst possible kind of crisis. I am grateful to you as an Afghan girl.", name: "B.S.", age: 18 }
  - { quote: "In the first days of the course, I felt so ashamed to ask questions and speak my ideas, but Cara said that I should not be ashamed. She encouraged me to share my problems and she helped me to solve them. Cara approached our class in an easy, friendly way so that no one felt weird about sharing. It was beautiful and holy. After taking this course, I know that I am free, I am strong, I am a woman.♥️", name: "R.A.", age: 22 }
  - { quote: "Here in our homeland, we are removed from all aspects of social life. Even though you have not seen our faces, you are working very hard to amplify our voices. One of the best achievements of this year is knowing you, Ms. Cara.", name: "K.N.", age: 20 }
  - { quote: "When I heard my own words spoken out loud by actors I felt happy, excited and curious. To be honest, I cried in some parts. I think I felt heartbroken by the surreal experiences we are going through in our lives. Although I was not able to be physically present during the performance, I saw myself among you. I felt like I was no longer in Afghanistan. I felt that I was free. This was the most beautiful feeling. Every sentence, every person, and every smile revived me. I am grateful for your efforts with all of my heart.", name: "A.M.", age: 26 }
  - { quote: "It melted my heart to hear our own words spoken out loud in public. I felt so proud, especially when I heard the parts that I wrote, I just wanted to dance. It was early morning and my sister was sleeping next to me. I was so excited that I pinched her hand and said, 'Those are MY words!!' It was an amazing moment in my life.", name: "N.H.", age: 19 }
  - { quote: "This course was very interactive and we felt very close to each other and our instructor. The best part was that I was able to ask the questions in my heart for the first time, without any fear. Our teacher became like a friend to us, allowing us to feel free. I learned how to speak out against misogyny and to not give up on breaking taboos in my society. This course was much better than I expected.", name: "D.Y.", age: 18 }
  - { quote: "Most of all, I learned to have self-confidence and defend my rights and those of my peers. The only thing I would change is to increase the duration of the course.", name: "F.S.", age: 24 }
  - { quote: "Knowing you is the best thing that has happened to my life this year.", name: "N.S.", age: 20 }

# Página "Supporter Testimonials": reseñas de Google (en el orden original) y testimonios destacados.
supporter_quotes:
  - { quote: "Voices Unveiled is a hugely important program. It does so much for the women it serves, women living in Afghanistan. The stories of the women who've attended the Voices classes tell of self-discovery, personal fulfillment, and even individual freedom within the hard frame of Afghanistan today. These stories show how much need there is for the work that Voices Unveiled does.", name: "John Boylan", detail: "Posted on Google" }
  - { quote: "There isn’t a whisper of a doubt that Cara and Voices Unveiled are having a huge impact. Afghan girls and young women are being heard and seen for who they are, who they dream of becoming. They are finding their voices, empowered to become change agents for the country they love and shed their tears for. We believe in them and find them astonishing in their resolve and resilience. Our support validates their courage.", name: "Mary Faddick", detail: "Posted on Google" }
  - { quote: "Voices Unveiled is doing cutting edge work with Afghan women and girls, walking alongside them towards their educational goals and mental health healing in a country filled with Taliban violence. We are proud supporters of Voices Unveiled and thankful for their work! - The Broomfield Resettlement Task Force", name: "Heidi Henkel", detail: "Posted on Google" }
  - { quote: "This organization does a fantastic job of providing education and hope to Afghan women, who live under a government that provides them with neither. I am proud to be a supporter!", name: "Carol Matlack", detail: "Posted on Google" }
  - { quote: "An organization that puts its heart into its goals. I am a witness to the incredible and positive impact it has on the lives of Afghan women. Thank you for giving them a voice and tools to improve their conditions.", name: "Coral Altamirano", detail: "Posted on Google" }
  - { quote: "An incredible organization that supports the educational of women in a world where equality isn’t recognized. It’s imp as CT shows how grass roots efforts can and do make a significant difference.", name: "Frank Cuevas", detail: "Posted on Google" }
  - { quote: "Hearing first hand experiences from these girls and young women who only want what our daughters take for granted, is inspiring. Supporting them makes me feel like Im making a real difference in a world that can make one feel hopeless.", name: "Tania Barricklo", detail: "Posted on Google" }
  - { quote: "Voices Unveiled provides crucial physical, intellectual, and emotional support to women suffering under the worst gender apartheid in history. It is an act of goodness, kindness, and love that is a blessing for everyone involved.", name: "Dr. Paul Kordis", detail: "Posted on Google" }
  - { quote: "Voices Unveiled, a vital life line in these dark times for Afghan women. Their nightmare can only be transformed if we keep the light kindled for them. Their battle is also ours ... women's rights and freedoms should never be taken for granted anywhere in the world.", name: "Helen Levy", detail: "Posted on Google" }
  - { quote: "This is an amazing charity that gives support directly to Afghan women whose lives are in danger. It’s great to know exactly where your money goes. But you can support these wonderful women in other ways if you don’t have money 🥰", name: "Ruth Druart", detail: "Posted on Google" }

featured_supporters:
  - { quote: "It is about time. Bringing one Afghan woman at a time out of Afghanistan is not the ultimate solution. Voices Unveiled is a good example of an initiative that provides education for women in Afghanistan focused on psychological, socio-political, and gender-related topics through online education. Many students are waiting for sponsorship so they may access these courses. You can help Voices Unveiled grow by sponsoring a student for one semester for just $300. This is our opportunity to work with Afghan women in Afghanistan on a massive grassroots level.", name: "Soraya Afzali", detail: "Ph.D. Candidate in Near and Middle Eastern Studies at Trinity College Dublin - ESR within Marie Sklodowska Curie Innovative Training Network @NETHATE Project", image: "/assets/img/official/soraya-afzali.jpg" }
  - { quote: "Access to knowledge and education is a fundamental right. My utmost respect to Cara Cruickshank and Voices Unveiled for their incredible work in empowering Afghan girls and women. Your efforts are truly inspiring!", name: "Dr. Stavit Sinai, PhD", detail: "Lecturer in Philosophy, Researcher, Editor. Berlin, Germany" }
  - { quote: "Thank you for your great service to Afghan women and for giving them hope. I firmly believe that any society, traditional or not, is destined to collapse if it silences women's voices, even in daily social interactions. Sadly, many in our Muslim traditional societies view women's exclusion from social life as a so-called ‘value’ and a ‘means’ of preventing ‘ethical corruption’. They forget that it is women who are the true custodians of our ethical, cultural and religious values and practices. If given freedom of speech and social participation, women are more than capable of directing and leading our societies towards prosperity and harmony. There are many examples of Muslim societies both past and present, where women’s active roles have been transformative. From the formation of the nascent Ummah during the Prophet’s (p.b.u.h) time, Abbasid, Umayyad and Fatimid caliphates, to the Mughals, modern Turkey, and Soviet and post-Soviet Central Asian republics and many others -all demonstrate the positive impact of women's involvement.", name: "Zohirbek Piltaboev", detail: "Educator and Research Professional, Former Academic Director for Aga Khan National Council for Afghanistan and National Program Manager for Aga Khan National Council for Tajikistan, and former Senior Expert and Technical Assistant for the Ministry of Education and Science of Tajikistan" }

# Citas que aparecen en páginas concretas del sitio original (misma página, mismo texto).
quotes:
  ariana: { quote: "I want to know more about the rights that we girls should have. We do not know our own rights. I want to understand them and experience a new version of myself by knowing such things. I want to pass it on to others.", name: "Ariana", age: 17, detail: "Kabul, Afghanistan" }
  fb: { quote: "As a woman living in Afghanistan, I need to learn self-empowerment to help transform the current reality for my mother, sisters, and other women. This course offers me a crucial opportunity to gain knowledge. Freedom feels like an unattainable dream, but I believe in working towards it. I want to acquire all the tools this course offers to empower myself, and I will pass on everything I learn to others.", name: "F.B.", age: 25, detail: "Kabul, Afghanistan" }
  sh: { quote: "This self-empowerment journey has been nothing short of transformative. Before this class, I was engulfed with self-doubt and unease, feeling my worth was nonexistent. Through meditation and soothing guidance, I’ve found a profound inner peace and contentment. Now, I stand with confidence, deeply appreciative of the person I’ve become. This course has been a guiding light, giving me growing strength each day. Despite the challenges that surround me, I find myself emboldened, ready to face whatever lies ahead. Words cannot express the depth of gratitude I hold for this life-altering opportunity.", name: "S.H.", age: 40 }
  viana: { quote: "I felt like I was a lost puzzle piece, and this course helped me find where I belong. It’s a place to heal, a safe space where you can share your thoughts, ideas, and experiences without fear of judgment. This course teaches you how to love yourself, prioritize your mental, physical, and spiritual well-being, and truly grow from within.", name: "Viana", age: 18 }
  esma: { quote: "This course helped me realize my worth and gave me the courage to speak up for myself. I consider it an opportunity for change. I want to keep learning, believing in myself, and inspire other Afghan girls to do the same.", name: "Esma", age: 13 }
  mahin: { quote: "I live in a remote area of Afghanistan where all educational institutions for girls have been shut down. Despite my deep passion for learning, I’ve been denied access to even the most basic resources. Financial hardship and Taliban restrictions make it impossible for me to study abroad or seek education outside my home. I’m eager to overcome these barriers and pursue my academic dreams. If given the chance, I will work tirelessly to contribute to my community and beyond.", name: "Mahin", age: 23 }
  najwa: { quote: "I joined the English class to improve my speaking, but then I saw the other courses, like coding and data, and felt even more excited. I didn’t know anything about programming, but the teacher explained everything so clearly. It made me feel smart in a new way. Now I know that learning new skills can open doors. Even if I’m in a difficult situation, I’m still moving forward, still building something for my future.", name: "Najwa", age: 20 }
  rq: { quote: "I can't fully explain what I have lost over the last three years. However, being with my Afghan sisters gives me strength, and having a supportive person like you with us is the greatest blessing we could ask for in these challenging times.", name: "R.Q.", age: 20 }
  chalipa: { quote: "I hated being a girl. I thought my life was over. Voices Unveiled helped me love myself again. It gave me hope for my life and future.", name: "Chalipa", detail: "14, Afghanistan", image: "/assets/img/official/voice-chalipa.jpg" }
  dasa: { quote: "Before joining Voices Unveiled, I wished I could be someone else. Now I thank God that I am a girl.", name: "Dasa", detail: "24, refugee in Pakistan", image: "/assets/img/official/voice-dasa.jpg" }
  ehsaneh: { quote: "I was not confident enough to speak. Now I believe I am valuable, precious, and need to be heard.", name: "Ehsaneh", detail: "28, Afghanistan", image: "/assets/img/official/voice-ehsaneh.jpg" }
  zahra: { quote: "No one has ever supported me or given me the kind of encouragement and learning opportunities that Voices Unveiled has. This course gives me strength and a reason to keep going.", name: "ZAHRA" }
  zainab: { quote: "I am so touched by the work Voices Unveiled does. Everyone should do anything they can to support them.", name: "Zainab Salbi", detail: "Honoree of the Time100 Impact Award, named one of the “25 Women Changing the World” by People Magazine, Founder of Women for Women International, Humanitarian and Co-founder of Daughters for Earth, Best selling author (Freedom is an Inside Job), TV host (#MeToo, Now What?) and inspirational speaker." }
  bella: { quote: "I was quite nervous when beginning teaching English to these students because I didn’t know if I would be able to connect with them as our lived experiences were so different, but instead I was faced with a classroom of the sweetest, caring and thoughtful students. Their patience, kindness and dedication in every class made me determined to teach them to the best of my abilities and hopefully contribute to the achievement of all their goals and dreams as much as I could. Although I was meant to be teaching them, they taught me a lot more in their never faltering kindness in the face of adversity.", name: "Bella", detail: "Photographer and Voices Unveiled Volunteer. Melbourne, Australia" }

